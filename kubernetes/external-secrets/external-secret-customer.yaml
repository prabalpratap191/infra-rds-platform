# ExternalSecret for Customer Service
# This syncs database credentials from AWS Secrets Manager to Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: customer-db-credentials
  namespace: customer-service-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: customer-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        database: "{{ .database }}"
        port: "{{ .port }}"
  dataFrom:
    - extract:
        key: rds/dev/customer-service
