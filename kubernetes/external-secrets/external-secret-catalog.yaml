# ExternalSecret for Catalog Service
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-db-credentials
  namespace: catalog-service-ns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: catalog-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        database: "{{ .database }}"
        port: "{{ .port }}"
  dataFrom:
    - extract:
        key: rds/dev/catalog-service
