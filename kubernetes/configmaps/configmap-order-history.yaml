# ConfigMap for Order History Service Database Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-history-db-config
  namespace: order-history-service-ns
data:
  DB_HOST: "<RDS_ENDPOINT>"
  DB_PORT: "5432"
  DB_NAME: "order_history_db"
  DB_DRIVER: "org.postgresql.Driver"
  DB_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  DB_SSL_MODE: "require"
