# Sample Spring Boot application.yaml for Customer Service
# This shows how to use ConfigMap and Secret in your application
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  namespace: customer-service-ns
data:
  application.yaml: |
    spring:
      datasource:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: ${DB_DRIVER}
        hikari:
          maximum-pool-size: 10
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
      jpa:
        database-platform: ${DB_DIALECT}
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            format_sql: true
            jdbc:
              time_zone: UTC
    
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE
